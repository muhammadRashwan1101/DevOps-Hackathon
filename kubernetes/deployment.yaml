apiVersion: apps/v1
kind: Deployment
metadata:
  name: backbenchers-deployment
  labels:
    app: backbenchers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backbenchers
  template:
    metadata:
      labels:
        app: backbenchers
    spec:
      containers:
        - name: backbenchers-app
          image: backbenchers-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backbenchers-config
            - secretRef:
                name: backbenchers-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"