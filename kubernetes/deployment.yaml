apiVersion: apps/v1
kind: Deployment
metadata:
  name: BackBenchers-deployment
  namespace: BackBenchers
  labels:
    app: BackBenchers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: BackBenchers
  template:
    metadata:
      labels:
        app: BackBenchers
    spec:
      containers:
        - name: BackBenchers-app
          image: BackBenchers-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: BackBenchers-config
            - secretRef:
                name: BackBenchers-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"