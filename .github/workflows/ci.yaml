name: CI

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backbenchers-app:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/backbenchers-app:latest .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backbenchers-app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backbenchers-app:latest

      - name: Deploy to Minikube via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if [ ! -d "DevOps-Hackathon" ]; then
              git clone https://github.com/muhammadRashwan1101/DevOps-Hackathon.git
            fi
            cd DevOps-Hackathon
            git pull origin main
            kubectl apply -f kubernetes/configmap.yaml
            kubectl apply -f kubernetes/secret.yaml
            kubectl apply -f kubernetes/deployment.yaml
            kubectl apply -f kubernetes/service.yaml
            kubectl get deployments
            kubectl set image deployment/app-deployment app=${{ secrets.DOCKERHUB_USERNAME }}/backbenchers-app:${{ github.sha }}
            kubectl rollout status deployment/app-deployment --timeout=90s
